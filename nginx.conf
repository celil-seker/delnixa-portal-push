worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream api_upstream {
        server delnixa-portal-api-1:8000;
    }

    upstream web_upstream {
        server delnixa-portal-web-1:3000;
    }

    server {
        listen 80;
        server_name portal.delnixa.ai;
        return 301 https://\$host\$request_uri;
    }

    server {
        listen 443 ssl;
        server_name portal.delnixa.ai;

        ssl_certificate /etc/letsencrypt/live/portal.delnixa.ai/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/portal.delnixa.ai/privkey.pem;

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }

        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host \$host;
            proxy_set_header X-Real-IP \$remote_addr;
            proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto \$scheme;
        }
    }
}

version: '3.8'
services:
  web:
    container_name: delnixa-portal-web-1
    build: ./frontend
    expose:
    - '3000'
    restart: unless-stopped
  api:
    container_name: delnixa-portal-api-1
    build: ./backend
    ports:
    - 8000:8000
    - '8000'
    restart: unless-stopped
    depends_on:
    - db
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
  db:
    container_name: delnixa-portal-db-1
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
    - db_data:/var/lib/postgresql/data
  nginx:
    container_name: delnixa-portal-nginx-1
    image: nginx:alpine
    restart: unless-stopped
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./nginx.conf:/etc/nginx/nginx.conf:ro
    - /etc/letsencrypt:/etc/letsencrypt:ro
    - ./certs:/etc/nginx/certs:ro
    depends_on:
    - web
    - api
volumes:
  db_data: null
